[project]
name = "mini-agent"
version = "0.1.0"
requires-python = ">=3.14.8"
dependencies = [
    "openai>=3.60.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释 / docstring 里的全角标点是刻意的，不算易混淆字符
ignore = ["RUF001", "RUF002", "RUF003"]
