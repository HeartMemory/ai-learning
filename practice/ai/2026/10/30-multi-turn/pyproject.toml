[project]
name = "multi-turn"
version = "0.1.0"
description = "用可变性知识维护 messages：多轮对话 + token 累积"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释 / docstring 里的全角标点是刻意的，不算易混淆字符
ignore = ["RUF001", "RUF002", "RUF003"]
